<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer | Powered by TMDB</title>
  <style>
    /* CSS Styles */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--card-bg);
      padding: 1.5rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 400px;
    }

    input, select, button {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
    }

    input { flex: 1; }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    main {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      background-color: #334155;
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: auto;
    }

    .rating {
      color: #f59e0b;
      font-weight: bold;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.5rem;
      border: none;
      cursor: pointer;
    }

    .modal-body {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .modal-body img {
      width: 180px;
      border-radius: 8px;
      object-fit: cover;
    }

    .modal-info { flex: 1; min-width: 250px; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>MovRec</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for movies...">
      <button onclick="handleSearch()">Search</button>
    </div>
  </header>

  <main>
    <div id="movieGrid" class="grid">
      <!-- Movie cards populate dynamically -->
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal">
      <button class="modal-close" onclick="forceCloseModal()">&times;</button>
      <div id="modalContent">
        <!-- Dynamic modal detail -->
      </div>
    </div>
  </div>

  <footer>
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <script>
    // --- CONFIGURATION ---
    const API_KEY = 'f06b6d797de88d17e8a7374bf688bc27'; 
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    // On Load: Fetch standard popular movies
    document.addEventListener('DOMContentLoaded', () => {
      fetchPopularMovies();
      
      // Allow pressing 'Enter' in search box
      document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
      });
    });

    // 1. Fetch Popular Movies
    async function fetchPopularMovies() {
      try {
        const res = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=en-US&page=1`);
        const data = await res.json();
        renderMovies(data.results);
      } catch (err) {
        console.error('Error fetching popular movies:', err);
        showError('Failed to load movies. Make sure your API key is configured.');
      }
    }

    // 2. Search Movies
    async function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        fetchPopularMovies();
        return;
      }

      try {
        const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderMovies(data.results);
      } catch (err) {
        console.error('Error searching movies:', err);
      }
    }

    // 3. Render Movie Cards to DOM
    function renderMovies(movies) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';

      if (!movies || movies.length === 0) {
        grid.innerHTML = '<p>No movies found.</p>';
        return;
      }

      movies.forEach(movie => {
        const posterPath = movie.poster_path 
          ? `${IMAGE_BASE_URL}${movie.poster_path}` 
          : 'https://via.placeholder.com/500x750?text=No+Poster';
          
        const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openMovieDetails(movie.id);

        card.innerHTML = `
          <img src="${posterPath}" alt="${movie.title}" loading="lazy">
          <div class="card-content">
            <h3 class="card-title">${movie.title}</h3>
            <div class="card-meta">
              <span>${releaseYear}</span>
              <span class="rating">★ ${movie.vote_average.toFixed(1)}</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // 4. Fetch Expanded Details using `append_to_response`
    async function openMovieDetails(movieId) {
      try {
        const res = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}&append_to_response=credits,videos`);
        const movie = await res.json();

        const modalContent = document.getElementById('modalContent');
        const posterPath = movie.poster_path 
          ? `${IMAGE_BASE_URL}${movie.poster_path}` 
          : 'https://via.placeholder.com/500x750?text=No+Poster';

        // Extract top 5 cast members
        const cast = movie.credits?.cast ? movie.credits.cast.slice(0, 5).map(c => c.name).join(', ') : 'N/A';
        
        // Find official YouTube Trailer
        const trailer = movie.videos?.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube');

        modalContent.innerHTML = `
          <div class="modal-body">
            <img src="${posterPath}" alt="${movie.title}">
            <div class="modal-info">
              <h2>${movie.title} (${movie.release_date ? movie.release_date.split('-')[0] : ''})</h2>
              <p><strong class="rating">★ ${movie.vote_average.toFixed(1)}</strong> / 10</p>
              <p><strong>Genres:</strong> ${movie.genres.map(g => g.name).join(', ')}</p>
              <p><strong>Top Cast:</strong> ${cast}</p>
              <p>${movie.overview}</p>
              ${trailer ? `<p><a href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" style="color: var(--accent);">▶ Watch Official Trailer</a></p>` : ''}
            </div>
          </div>
        `;

        document.getElementById('modalOverlay').classList.add('active');
      } catch (err) {
        console.error('Error fetching movie details:', err);
      }
    }

    // 5. Modal Control Functions
    function closeModal(event) {
      if (event.target.id === 'modalOverlay') {
        forceCloseModal();
      }
    }

    function forceCloseModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function showError(message) {
      document.getElementById('movieGrid').innerHTML = `<p style="color: #ef4444;">${message}</p>`;
    }
  </script>
</body>
</html>
